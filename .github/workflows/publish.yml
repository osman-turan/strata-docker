name: Build and publish Strata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Strata release tag to build (leave blank for the latest release)"
        required: false
        type: string
      force:
        description: "Rebuild even when this release is already published"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: strata-image-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: osmanturan/strata
    steps:
      - name: Check out image builder
        uses: actions/checkout@v7

      - name: Resolve Strata release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.release_tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid release tag: $REQUESTED_TAG" >&2
              exit 1
            fi
            gh api "repos/Niko1221/Strata/releases/tags/$REQUESTED_TAG" >/dev/null
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$(gh api repos/Niko1221/Strata/releases/latest --jq .tag_name)"
          fi

          if [[ -z "$release_tag" ]]; then
            echo "Could not resolve a Strata release tag." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Building Strata release $release_tag"

      - name: Check out Strata release
        uses: actions/checkout@v7
        with:
          repository: Niko1221/Strata
          ref: ${{ steps.release.outputs.tag }}
          path: strata
          persist-credentials: false

      - name: Record Strata revision
        id: source-revision
        shell: bash
        run: echo "commit=$(git -C strata rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: osmanturan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check published release
        id: published
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ github.event_name == 'push' || github.event.inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          published_tag=""
          if docker pull "$IMAGE:latest"; then
            published_tag="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:latest" 2>/dev/null || true)"
          fi

          if [[ "$published_tag" == "$RELEASE_TAG" && "$FORCE" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:latest already contains Strata $RELEASE_TAG. Skipping the rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Published version: ${published_tag:-none}; requested version: $RELEASE_TAG"
          fi

      - name: Build and push image tags
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./strata
          file: ./strata/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            osmanturan/strata:latest
            osmanturan/strata:${{ steps.release.outputs.tag }}
            osmanturan/strata:cuda-latest
            osmanturan/strata:cuda-${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=strata-linux-amd64
          cache-to: type=gha,mode=max,scope=strata-linux-amd64
          labels: |
            org.opencontainers.image.title=Strata
            org.opencontainers.image.description=Strata NVIDIA CUDA image built from upstream releases
            org.opencontainers.image.source=https://github.com/osman-turan/strata-docker
            org.opencontainers.image.documentation=https://github.com/osman-turan/strata-docker
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source-revision.outputs.commit }}

      - name: Report published image
        if: steps.published.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: echo "Published $IMAGE:latest, $IMAGE:$RELEASE_TAG, $IMAGE:cuda-latest, and $IMAGE:cuda-$RELEASE_TAG"
